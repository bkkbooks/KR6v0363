body:
  text: 密乘教幢居士郭元興撰稿金剛阿闍黎慈威上師校註蓮華金剛藏本一大圓滿的意義和內容西藏的寧瑪派是指以前宏期入藏的蓮華生梵藏或梵藏和無垢友梵藏等為主所傳承下來的密咒教法這一派在理論上和修學實踐上都和印度後期密宗超岩寺和歐丹多富梨寺建立之後有很多地方不同所謂大圓滿也就是這一派所特有的密法它是這一派的密法中最高深的一種也就是最流行的一種西藏新派的大師們對于這個法門也有加以懷疑的但也有信任重視的參看土官宗派史鏡舊派史抉擇段頁至頁及松巴佛教史頁至頁不管怎樣這一個密法經過舊派歷代的推闡已經成為現存密宗中重要學說之一寧瑪派立說的基本在將一切世出世法判為三乘即因仍人天乘藏顛倒外道乘和真實內道乘藏人天乘包括世間一切善法學術外道乘包括一切顛倒邪執的外道宗派內道乘則指佛法在內道乘中又可分為九乘就是通常所稱的九乘次第藏現在我們把九乘的分類列一表如下依無垢光宗派藏論說真實內道乘因乘三下下聲聞乘小乘二佛法九乘佛法下中獨覺乘下上菩薩乘因乘一果乘六外牟尼續乘三中下事乘果乘六中中近乘中上瑜伽乘內大密咒乘三上下摩阿瑜伽乘上中阿努瑜伽乘上上阿底瑜伽乘在這九乘中初三乘認為是化身佛釋迦牟尼所說名為共乘藏中三乘認為是報身佛金剛薩埵所說名為密咒外乘藏也有把這三乘分開來判認為事乘梵藏是釋迦牟尼自說而近乘梵藏行續和瑜伽乘梵藏為毗盧遮那所說上三乘認為是法身佛普賢所說名為內無上乘也有認為是大金剛持在廣大法生剎土中所說的這九乘的次第和印度晚期以及西藏後宏期新派的密宗理論比較起來中三乘相當於新派所說的下三部而新派的無上瑜伽部在九乘次第中却開為三乘一般來說下三乘和中三乘與新派的學修差別不大分歧最大的在上三乘這一部份尤其是在上三乘中舊派另有超越一切的大圓滿乘阿底瑜伽的建立為了要說明大圓滿這一乘的意義和內容我們需要先簡單地敘述一下這一派所提出的顯密的區別和密部各乘的意義在九乘中除初二乘是小乘外其餘七乘都是大乘大乘中一個是因乘六個是果乘即密咒乘這果乘即真言乘是比因乘即顯教西藏名契經乘因為以佛說契經為宗之故更殊勝的因為密咒乘以光明心和它所有的諸法為鏡而顯乘則於如實的體道果昧於抉擇而且顯乘總是從因明門來審察用正比量來校量勝義諦理安立止觀法門要經時多刼才能得一分果證法門方面除了抉擇蘊界處等世俗諦而作取捨以外也沒有什麼別的了真言乘則不假藉因明之門直以扼持身語脈風明點等之要為道以無念之法身藏為體於一生等即可通達勝義諦現證菩提並且在密咒乘中以法界為光明曼茶羅為體對于以它為依的世俗諦一切蘊界處都不作取捨認為當體即是本尊宮殿和剎土的莊嚴以這種觀念為道而修持而以分位成就八大悉地究竟成就現證菩提為果這些都是顯教所沒有的至於真言乘中方便多困難少不需難行苦行義利大另外還有見行心因道果時受用瑜伽自他義利密意等分別都是密乘勝於顯教的地方在真言乘中又有六乘之分事行瑜伽三乘在新派中判為下三部這三乘和上三乘比較起來關於能成熟相續的灌頂和能解脫相續的修道都有不同當然以上三乘為殊勝這六乘各別的意義為事乘梵藏中以世俗迷相所現蘊界處諸法為所淨之垢以法界本性清淨之心性為淨治所依體以淨行為道而觀修本尊把自己和本尊智身智慧薩埵的關係看作主僕一樣的關係來求取悉地近乘梵藏俱乘或行續見同瑜伽乘而行同事乘於自三昧耶身前觀本尊智身如兄弟或同伴而求悉地瑜伽乘梵藏是把情器一切世俗諦法在勝義菩提心性中予以淨治以五相現證菩提為道在生起本尊曼荼羅時於自己三昧耶身中請送本尊智身而求悉地大瑜伽乘也呌做大方便父續藏它認為一切法本來成佛都是身智三身五智的遊戲以生起次第方便為主自己和本尊智身平等一體三業和三曼荼羅自性不離以微細息風瑜伽為道而求悉地隨瑜伽乘梵也呌做般若母續藏它認為一切法本來在曼荼羅中已成佛所以法界與正智無別一體依大樂界微細瑜伽而求悉地極瑜伽乘梵也呌做無二大圓滿藏它認為一切法本來在菩提心中圓滿具足所以生死涅槃不出菩提心曼荼羅無為本具不證本達一切悉地不出本分法身以最後一乘無二大圓滿為最殊勝這上面三乘也呌做內方便續大圓滿是指一種現前離垢明空豁朗的內證智梵藏它的意思是說三有所顯和生死涅槃所持的一切法無不在這個證智空性中圓滿具足所以呌做圓滿解脫生死的方便沒有比這個更殊勝的所以呌做大這個內證智也就是心性光明的菩提心又名自然光明智從修持果果證方面來說這個自然智的本體空分即法身本性顯了分即報身大悲明證分即化身三身本來在本分上具足不必另有精勤修作即已圓滿所以呌做大圓滿大圓滿為什麼較其他各乘殊勝呢九乘中初二乘為小乘可以不論菩薩乘不離用尋思伺察推求以辨二諦而大圓滿之菩提心則超越尋伺推求事乘住于二取清淨之境而大圓滿之菩提心則超越二取近乘俱乘行乘未通達悟無二勝義境而大圓滿則是無二之菩提心瑜伽乘求生密嚴剎土不能住于無取無捨而大圓滿則為無取無捨之菩提心大瑜伽乘求證金剛持位所以用方便勝慧般若為趣入門而大圓滿之菩提心則超越勤修隨瑜伽求證無別故以界智為入門而大圓滿之菩提心則超越因果總括地說下八乘不用自然智所以都以漸修為宗不能出因果生死的樊寵而流於沒有性修的偏執但大圓滿則把種種顯現都化為一實相所以叫做自然出過勤修至於大圓滿的見修行果也和其他各乘不同它認為在見上沒有所肯定的所以超越文句名言在修上沒有所否定的所以沒有取捨立破在行上沒有所肯定和否定的所以所作之法都法爾解脫在果上沒有所斷所證的所以遠離自他的觀待這大圓滿的修法又可以分為三部內容如下表以上參無垢光宗派藏第七品大圓滿心部界部要門部外內秘密無上這大圓滿內三部的意義如下心部認為所現皆心都是在心性自然智中起現所以除了自然智就沒有其餘的可得了這一部的引導行法和新派大手印大致相同但大手印是以心住印境心部則直判有境之心即本淨的心性智空所以本質上還是有很大的區別的略同中國禪宗南北兩系之異界部認為除了法性普賢界外別無所趣之處所以遮遣除法性界外有其餘的生起的看法這一部特別注重光明和新派的五次第大略相同但本質上也還有分別五次第以收束五種息風之要搏採幻身空色光影再要隨滅于光明中化為精澄之身所以是有功用道界部則安住遠離緣慮之深要不假事修功用依深明智慧雙運而證虹身金剛身所以更為殊勝要門部對於所取所捨以雙運無二之智抱生死湼槃一切法都導入遠離執取的法性空中依這法要現起生死湼槃都無分別的內證智性法性之境所以能成熟為自證智連繫身而得解脫這一部法以超越道之光明為主雖然和新派的六加行相似本質上還是很不同的六加行用收束五種息風趣入中脈的法要現起空色的影像漸次引修有功用的大樂道這一部則斷絕一切意度後實相自顯現前明證所以更為殊勝見土官舊派史這三部法本身的判別又以要門部為最殊勝因為在理論上心部仍然執着意識審察界部則執着法性仍然流於意識審察而要門部能令實相自顯故更殊勝又從修證方面說三部都要化智身為虹光但要門部則不僅是把粗重三門三業化為微妙澄淨之身而是以究竟了法性窮盡光明所以一切粗細三門自然化成三身五智的體性二大圓滿中最盛行的要門部的理論和內容大圓滿是阿底瑜伽見修的總稱而阿底瑜伽的深要又在要門部要門部中又分外內秘密無上四部這要門部中的無上部又稱為自性大圓滿心髓金剛藏乘簡稱大圓滿的寧提心髓這寧提的傳承主要的有兩派一派是由吉祥師子傳蓮華生空行智慧海王而傳下來的叫做空行寧提一派是由吉祥師子經智經無垢友傳下來的叫做上師寧提二派的理論大致相同祇不過修法方面少有區別要門部所依的本續傳說甚多它的內容有二萬另十二部別異三萬五千品六百四十萬頌五千樞要八大護一百八十訂定九十萬遮遣七萬判分十五萬斷捨及聖語等但是西藏譯出的只有少分而且根據一般的見解本派的和異派的這六百四十萬頌的經典原本也非印度所有以上見無垢光宗派藏我們這裏只把要門部的無上部的見修行果簡單說明一下這一部名為自性大圓滿心髓金剛藏乘又名證智自顯妙道金剛藏大秘密乘又名光明金剛藏乘簡稱寧提心髓大圓滿法的全部勝於下八乘而這一部法又是大圓滿中的最深之法為大圓滿的極頂所以比下九乘大圓滿中其餘法門包括在內都更殊勝殊勝的道理有以下各點見無垢光勝乘藏論宗義差別段及宗派藏第八品餘的法門都偏重般若所以可以速得開悟但欠缺超脫力所以不能即身解脫本部法有見根法要指淨眼根只論精勤的大小不管根機的利鈍都可成就其餘的法門對于各各法性都在意識審察中建立信念所作空觀如暗中投石形同摸索本部法則不用意識審察現前即有現量親證其餘的法門都以能說的文句為憑藉所以對於義境一開始就要求通達領悟本部法不用文句一字而現前覩見義境以現量親見因此可以不依文句而成佛其餘的法門對于各各實相的義境都以心慧取為觀境而建立體道果時時要用思維籌量本部法顯了現證不用心慧所作分別體道果即可成佛其餘的法門總要分別前後因果故不能不另外去求菩提本部法菩提自現所以不用因果勝劣的作業也不必精勤修行分別取捨其餘密法要用脈風明點等當年齡少壯時脈道舒展易證菩提年齡老大則大種力衰故不能得解脫本部法光明的日月從內起現所以只要具足精進不管年齡的老幼都能解脫其餘的法門都認為三身是究竟果是所觀待的法本部法三身在道中即明朗顯現所以在究竟光明本淨界中能任運任持證智的妙有境界總之大圓滿中心界兩部雖能遠離言談安足處所現量覩見證智其心可以須臾間自顯而住即許這一種動靜相為究竟但事實上沒有真正看見仍不過是意識審察之境本部法能以真實法要現前明見當然更殊勝了又要門中的外內密三部道果方面仍然要以中有位的境界為憑藉本部法則現生即可解脫為光明身為了上面這些原因光明金剛藏乘所以成為一切乘的極頂在這一乘中又分決斷梵藏和超越梵藏兩部後者以前者為依如果只修前者即身也可以化為微量而成佛但對于外迷相地石山岩等不能淨化且修道時仍以粗脈風為依不能成就光明身現身不能達究竟極地超越法則現生能證光明身而得大遷轉身成為廣大利他事業而且所得天眼神足力通也有廣狹大小之異因此在本部法中又以超越法為最究竟這一部法的理論根據在阿毗達摩大乘經中的頌文無始時來界一切法等依由此有諸趣及涅槃證得它建立本初之體自然智為一切法依自然智的本體空分像虛空一樣就是法身本性顯了分像日月一樣就是報身大悲周徧分像日月的光華一樣就是化身所以三身在本分上完全具足三界眾生因為業力所蔽顛倒迷亂對于這個所依的實相不能了知所以輪廻六趣受種種之苦一切有情在迷亂時因為有身口意三業的攪擾這自然智雖不顯現然而並不是沒有就每一有情的身上說身為脈之所依脈又為風和界之所依在金剛身的三脈四輪中央有自然智宮心法殿當中即有自然智光明之體本部法中三脈四輪的建立和其餘的金剛乘相同另外不共的有四大殊脈為光明安住的處所這四個脈是迦底大金脈在中脈之中與肉團心中央相連有普賢根本明點光滿其中如白絲綫脈附于光明脈向上通梵穴有運轉法性無生道明點這是修識遷轉頗瓦的道路細旋脈在四輪之中有賢頂明點晶管脈連結心眼有具賢嚴明點這是現起無數金剛連繫光明的依處同時在心臟肉團心中央有具足光明的光明脈像放光一樣照明一切細脈這就是所謂如來藏周徧的意思這個能明照的內證智本性即空本性是五光常照大悲的光輝周徧所以是三身五智的大藏大生處但是它的本體法身空上清淨智見之分被阿賴耶和八聚識所障本性五光明照分被有質礙的血肉蘊聚所障大悲光輝和證智起處被業和習氣所障因此它的體性極難覩見但並非沒有它是周徧一切有情以各各有情之身為依而存在的所以說本初界自然智如來藏在現前的肉身中周徧而住以上見無垢光宗派藏論第八品又見勝乘藏論及句義藏論其次關於修持的方法也和一般真言道相同分為能成熟的灌頂和能解脫的修持兩部分如下表修持能成熟道四灌頂外有戲論寶瓶灌頂除身障內無戲論秘密灌頂除語障極戲論智慧灌頂除意障最極無戲論辭灌頂除所知障能解脫道前行共同前行不共前行不共正行這四種灌頂都需要圓受受寶瓶灌頂可於生起次第修法得自在受秘密灌頂可於修圓滿次第拙火旃荼梨及字輪誦咒得自在受慧智灌頂可於修大樂雙運及通達本淨法性智得自在受辭灌頂可於修現量任運之義得自在如不受灌頂過患極大如最勝本初續即大樂金剛經廣本說未灌頂者為說續令修如斯深妙法雖善了知其義利終墮地獄不解脫要是能夠圓受灌頂則在一切分位都能成就所樂求的事情在修道時光明脈清淨能夠生起殊勝三摩地成為諸佛之子任持佛的種姓壽命長遠受用威權都能具足永斷一切惡趣領受天上的廣大安樂吉祥現身證得究竟佛菩提果其次進入修道因為本部法出過一切起心作意現前令見光明智慧所以對于一切以意識審察為性的生起次第和圓滿次第都要棄絕初步先修共同前行再修不共前行以修金剛薩埵或蓮華生為主再依上師指授如理修持正行一般說來如果在塚間空谷洲渚等極最靜的地方如說觀修等到四光明的境界逐次起現那末上根只要三年中根五年下根極長七年另七個月內外質礙之境都化為光明就可以在自顯色究竟之處現證佛法這裏所說的色究竟是法身普賢所住的法性土不是一般的色究竟天本部修法的正行主要是些實修的方法所以特重口傳要門部的原名梵文是是近處指示的意思藏文作也稱面教的意思修法內容的綱目大致初步是指示身語心三要身要有五種或三種姿勢師子奮迅勢大象眠臥勢仙人蹲踞勢等再指根門要緣境要息風要證智要等以看光明然後四種光明即可逐次現前四光明法性現量光明證受增長光明證智完量光明法性窮盡光明第四步光明又有漸盡和頓盡的分別在這現見光明的剎那證智中阿賴耶俱三界心心所都可遣離一般密咒下乘以味展二脈的風心趣入中脈所生樂明無念之智認為是俱生智這是仍然未遣離阿賴耶八聚識的狀態因為樂明無念中的安樂受是意與染污末那未分的無念所以即是阿賴耶這裏微作明淨狀的就是阿賴耶識色聲等五種粗境仍依根識各別顯現所以仍有五門識這些如果不加遣除仍是不能解脫生死的因為他還沒有解脫生死之心的緣故並且下乘密咒以脈風明點一味和合之為根本義所以認為要使風界等從味展二脈趣入中脈使脈紘各各舒解由此起現初地以至佛地的各別功德這種法門障礙很多而且本風要是進入六趣輪廻的脈瓣中反而可以引起很多迷亂的境相引生過患本部法則可使諸風自滅而住各各脈瓣之風自成清淨這時光明脈中的智風就在本位上自然朗照所以清淨智慧之境身光剎土等都能當前顯現而迷境不復生起等到中脈裏的光明脈增長那末諸脈紘就漸化光明地道功德即在本來光明中出現這就是得到解脫了譬如當初二紘中脈中化為光明時在外面顯現的光中就現出一千二百個佛土如果把自己的光輝分照那里再收攝到本來光明中那末就到那一剎土去了身頸轉動一下就可震動照耀百佛世界內心又能入出百種法性無分別三摩地所以此已遠超下乘之地了依這個法要以見根淨眼根現量瞻覩的一剎那澄停不動遠離合散的智慧就是在本分上證法身的決斷外面顯現光明照了的方便就是任運起現自性色身道的超越因此外所顯就是生起次第起現方便的法要內明照就是無生而滅諸戲論的圓滿次第現證遠離邊際的般若這樣方便般若生起圓滿法身色身顯相空性福德智慧等資糧都在修決斷超越時剎那圓滿這時五身五智也都剎那圓滿因為心一境性遠離戲論就是法身自顯無執就是報身現種種境就是化身遣八聚識就是菩提身界無遷變就是金剛身又遠離緣慮戲論就是法界智顯了無障就是圓鏡智住平等味就是平等性智所顯五光無染就是妙觀察智能所二取根境皆化光明即成所作智在修法時安住光明之剎那也可以盡標下九乘的密意勝利因為這時沒有補特伽羅及法我執所以盡攝聲聞獨覺菩薩三乘密意又安住光明之剎那身語意三都沒有煩惱垢染所以盡標清淨行事近瑜伽三乘密意又安住光明之剎那光明證智無二三者双運聞覺現證殊勝三摩地所以盡標大隨極三瑜伽乘密意其餘的陀羅尼三摩地以及諸地道等都是就內證智無垢分上安立的所以也同時盡標這樣一來下乘所修的一切三摩地和所聞覺的一切功德法無不盡標於此安住光明的剎那中本部法的果證就在圓滿四光明道的時候隨修行者的願心而有兩種成就一種是想用現身成就廣大利生事業壽命無邊盡三有際就可以證取大遷轉身這種身性像水中月一樣雖有顯色但沒有觸色如同大阿闍黎無垢友和蓮華生能在一剎那中示現不可思議神通法門另外一種如果不想依現有成辦廣大利他事業那末在身化光明時就到法界本初地任運成就三身五智所以在法身剎土就成為普賢在報身土任運密嚴剎中成為自顯受用身再由加持力在清淨佛土現為五部如來饒益諸住地菩薩更於六趣中示現各趣大師廣作義利以殊勝變化工巧及受生變化等事窮有三際饒益無盡三大圓滿前後宏期在西藏的傳承流布簡況及抉擇總結大圓滿法的內容大略如上所述這一部法是西藏寧瑪派的密法之一種關於寧瑪派的一般傳承情況可以參考寧瑪派條這裏只把大圓滿法的源流根據史實加以推考大圓滿的梵文名稱西藏舊派的著作中多用摩阿珊底一語也有用摩阿扇底的恐怕是上一名稱的音訛珊底有關節相續深密密意諸義而大圓滿本身所屬的阿底瑜伽也有叫做阿訥尾瑜伽的阿底是極的意思中國古翻也有作無極的如唐代來華的阿地瞿多即翻做無極高阿訥尾是無二瑜伽的意思印度後期密宗雖然沒有和大圓滿同名的法要但對於無二瑜伽是承認其存在並且也有認為應在無上瑜伽之外別立一部的關於阿底瑜伽要門部的傳承寧瑪派中傳說分為天上和人間兩個階段天上為提婆賢護之子慶喜藏名為具勝心天子受金剛手的傳受人間的傳承是由具勝心降生烏萇國為烏波囉遮王女華明之子名為極喜金剛或又名喜金剛又名笑金剛極喜金剛執政時金剛手親來灌頂傳法後極喜金剛傳法于阿闍黎妙吉祥友妙吉祥友傳法于吉祥獅子吉祥獅子是地戍奢洲人父名具善母名光顯女他在二十五歲時遇妙吉祥友圓滿承受阿底一切教法妙吉祥友傳烏萇第二佛指蓮華生智者若那修多羅即智經大哲無垢友和大譯師遍照等人自吉祥獅子以下都是持明表示傳承蓮華生無垢友以下都是補特伽羅耳傳這耳傳又分兩系一系是蓮華生傳空行智慧海王埋藏法寶以待有緣後由蓮華業緣力取藏傳遍智自然金剛大寶法王第三世及雍敦金剛吉祥等為空行寧提一派另外一系是由無垢友傳孃定賢他建烏汝奢寺埋藏教授後由登瑪倫賈取出傳給孃法尊師子自在由他遞傳給孃迦當巴他把教授埋藏三處三十年後由結貢那薄在公元一六七年取出這時陸續取藏的還有嚮巴日巴漾敦諾札即吉祥金剛公元一九七丁丑生漾敦諾札傳子億日公元一一五八戊寅一二一三辛酉他又傳子覺貝公元一二三一辛卯以後遞傳師子奄迅他傳鏡金剛公元一二四三癸卯一三三癸卯他再傳持明俱摩羅闍公元一二六六丙寅一三四三癸卯他再傳隆欽饒降巴公元一三八戊申一三六三癸卯這一系叫做上師寧提隆欽饒降巴又名無垢光他也曾受學空行寧提又遍學後宏期新派密法關於明處顯經密咒的著作極多被推為舊派中智者之首從現存史料上看自無垢光開始大圓滿的教義才成了有組織的和系統的書面的學說現在西藏方面寧瑪派的寺院有金剛崖成熟解脫洲和桑耶等寺西康方面有白玉寺迦陀寺竹箐寺和昂藏寺等都宏揚舊派的大圓滿教法關於大圓滿法的教義西藏後宏期中像寶賢夫枯巴等認為在印度找不到這個法的傳承和教典認為是有問題的布端和宗喀巴師弟等對于這個問題則置之不談但是新派中人信奉受學大圓滿法的也很多欲知其詳可參看土官舊派史抉擇淨不淨段和松巴佛教史二四一二五三頁當然本派中的極意推崇和異派的肆情詆毀這些情況都是難免的現在我們只就大圓滿的起源地和發展的過程中有關人的問題和教義的問題提出幾點來談一談傳承大圓滿法的人間第一代祖師極喜金剛出生在烏萇這個地方西藏名為或即梵文的或位置在現在的河流域一帶漢時屬於高附翎候高附即現在的魏書法顯佛國記洛陽伽藍記均作烏萇西域記作烏仗那求法高僧傳作烏長那新唐書吐火羅傳中作越底延宋史天竺傳作烏填曩我們從宋雲使西域記洛陽伽藍記引和大唐西域記中的敘述知道這個國家自古即以咒術著稱見伽藍記卷五宋雲與惠生使西域條又大唐西域記卷三烏仗那國條又古代從烏萇來華的沙門像曇摩羅伽藍記卷四和那連提黎耶舍見高僧傳本傳等也都特嫺咒術屬現神變所以這個地方從現存的史料來看是可以當作北印真言乘的一個發源的地方這地方和中國的關係我們從史書上看到漢時的高附翎候本來是由中國西部西遷的大月氏部族在西域所建立的國家之一以後張騫西使和班超定西域一直和漢地聲氣相通公元五一九年宋雲到烏萇時國王膜拜受詔對漢土文教備致敬仰之誠公元六四二年貞觀十六年烏萇國王達摩因陀訶斯遣使獻龍腦香等太宗任詔致答公元六五八年顯慶三年以罽賓即迦濕彌羅藏語以修鮮都督府公元七五七六間神龍初拜罽賓王為修鮮等十一州諸軍事修鮮都督公元七一九年開元七年罽賓王遣使獻天文及秘方奇藥玄宗冊其王為葛邏達支特勤後王烏散特勤灑年老請以子拂蔴罽婆嗣位玄宗聽之公元七二年因大食與烏萇接壤大食數誘之烏萇土與骨咄俱位商稱或二王不肯臣四月丙午玄宗遣使者冊為王公元七四五年天寶四年冊罽賓王子勃匐準為罽賓及烏萇國王西藏後期傳西方兩勝地即烏萇罽賓並擧見松巴佛教史三頁從上面的史實看來在唐代盛時烏萇可以算做中國屬國之一密宗學說根源雖然在於佛說的經典但義理方面經過後來祖師們的發展頗多受到在中國本土所產生的各宗派像禪宗天台賢首的影響以及道家的影響值得指出的一件事就是在公元六四六年左右玄奘法師把老子和大乘起信論譯為梵文傳布五印這正是大唐國威方張而印度密乘學說將興未興之際這一個關鍵性的事實應該說不是偶然的其次關於極喜金剛這個人的問題在後宏期西藏的佛教史籍中如多羅那他印度佛教史找不到關於他的資料但是從他的西藏譯名看來梵文應當是以難陀開頭的一個名字我們在義淨求法高僧傳中正發現他提到一個持明咒藏的大成就者叫做難陀的但他說這個難陀是阿離耶那伽曷樹那聖龍樹的門人現在日本的佛教學者已多認為密宗中的龍樹大約是在公元六四五年左右在世的那末在一百年之內六四五七四九經過四傳而到蓮華生依佛海考蓮華生於七四九入藏情理均合即使不然我們看不空一系的密宗傳承不空和蓮華生同時從龍樹經龍智金剛智到不空也不過四代那末從龍樹經難陀妙吉祥友吉祥師子到蓮華生共有五代也就沒有什麼問題了根據多羅那他所作的蓮華生傳來推斷蓮華生應當比不空年齡要小一點特別值得注意的就是大圓滿的傳承中有一個漢人吉祥師子由義淨的大唐西域求法高僧傳可以看到當時赴印求法的漢人是非常多的唐初受著玄奘義淨西行求法所得到的偉大成就的鼓舞在義淨以後當然仍不在少數而且唐時烏萇一帶已列為軍州前往的人就不一定限於出家僧侶了這些西行求法的人大多數都是在漢土對於內外學藏都有很好的基礎的從時代來說吉祥師子可能是這些人當中之一西藏前宏期中傳授大圓滿的幾個人像蓮華生無垢友遍照都是他的弟子這幾個人都是在西藏發揮所學無怪後來在印度找不到大圓滿教法流傳的痕跡了密宗裏面特別注重傳授這種印度失傳的情況是不足怪的中國不空三藏所傳的密法裏面也有在印度和西藏找不到傳承的經軌但沒有理由說它是出於偽造另外關於大圓滿的教義問題也有幾點可以提出來談一談這裏我們先要說一說在西藏的實際傳授大圓滿教法蓮華生的一件事明末的西藏史家多羅那他在一六一年繼他完成印度佛教史一六八之後根據他遊訪印度所得的資料做了一部蓮華生傳呌做三信具足不從舊派誇張之說一以實錄為歸雖然當中所列事實現在看來也有許多不無可議的地方但總算是一部比實翔實的著作他在傳中提到蓮華生在印度修大印悉地得到成就以後立名大樂金剛又提到他從智足學到的法有吉祥勝初又提到他得到大成就以後修降三世的獨鈷杵鐝去降伏外道的一回事這些事情很可以同中國傳譯的幾部經軌印證起來中國唐玄奘法師在譯大般若的時候在六六三年譯出理趣般若一卷繼能斷金剛般若之後編為第十會從玄奘法師編排大般若經的次第看來他顯然認為這是一部究竟果乘之作玄奘法師次年六六四年即歿後來弟子基公作了一部般若理趣分述贊說是理趣甚深法非我所能讚今依親教尊的智慧加持力故說玄奘師弟之間對於這部經的推崇重視是很顯然的以後公元六九三年長壽二年菩提流志又重翻為實相般若波羅密經一卷公元八八年不空三藏又重翻為大樂金剛不空真實三昧耶經般若波羅密多理趣品一卷並廣譯和這部經有關的密部儀軌宋施護於公元九九一年淳化二年又重譯為徧照般若波羅密多經一卷公元九九九年法賢又譯出密部全經最上根本即勝初大樂金剛不空三昧大教王經七卷不空所翻的和這部經有關的儀軌下列九種一大樂金剛不空真實三昧耶經般若波羅密多理趣釋二卷公元八七九年二金剛頂勝初瑜伽普賢菩薩念誦法一卷公元八七九年三普賢金剛薩埵瑜伽念誦儀軌一卷公元八七九年四大樂金剛薩埵修行成就儀軌一卷公元八八年五般若波羅密多理趣經大安樂不空三昧耶真實金剛菩薩等一十七尊大曼荼羅義述一卷公元八八年六金剛頂吉祥勝初瑜伽經中略出大樂金剛薩埵念誦儀軌一卷公元八八年七大樂金剛薩埵修行成就儀軌一卷公元八八年八金剛頂瑜伽金剛薩埵五秘密修行念誦儀軌一卷公元八八年九金剛頂瑜伽他化自在天理趣會普賢修行念誦儀軌一卷公元八八一年上面這些經軌連他所翻的本經共計十種另加有關的金剛王菩薩秘密念誦儀軌和金剛壽命陀羅尼念誦法大樂金剛即普賢延命則有十二種這可以說是他用功最勤用力最深的一部密法了的確不空的密宗思想也就在五秘密儀軌和十七尊曼荼羅義述這二部的體裁是不空的編述中表現出來勝初是本經的原名梵文是藏文是參看西藏譯本慶喜藏所作吉祥勝初廣釋收入丹珠爾續部密部中以大樂金剛薩埵為法界身參五秘密軌及十七尊義述以普賢為法身為西藏舊派所祖述的義理都是這一部類的經軌的思想修法之時不安壇像見日本阿婆嚩抄更有眼印之儀以各種視法瞻覩此法界體之金剛薩埵見吉祥勝初瑜伽中略出軌及修行成就軌又要四時行住坐臥中皆法界體性不假功用任運修習見五秘密軌十八會指歸十三十四兩會義及阿婆嚩抄這些理事行法也和大圓滿的正行相同至於不空所譯儀軌中一再提到即生即證大樂金剛薩埵之智還提出來六個月一個月證金剛薩埵身能以降三世身調伏有情壽命無邊等說法也和多羅那他所述蓮華生的成就和大圓滿家所講的尅期取證的情況若和符契特別是蓮華生得到大印的最高成就以後立名大樂金剛這大印是這一類法中所特有的悉地就中國密宗而言至於大樂金剛之取自理趣般若更是非常顯然的從上面所舉的情況史實和教義看來西藏舊派的大圓滿法倒可以說是真正密宗的古學這由難陀極喜所聞創出來的一派經過漢人吉祥師子和烏萇王族之子據多羅那他蓮華生的傳入西藏以至無垢光的發展成說不管在理論上和實踐上都有他的特殊優越的地方它之對于印度後期興起的無上部以修氣練精為主的密法顯存輕貶倒不是入主出奴而實在是另有見地了西藏後宏期有些論師和譯師對於大圓滿法所作的疑偽的論斷主要以印度不見傳承為根據那是未見其然的因為密宗中差不多每一種法門都是由某一位得成就者所創立然後遞代相傳演成不共的宗派如果否定這一點不特某一種法門有問題連全部的密宗以及全部大乘經典都不能成立本來密宗中所謂不共的高深義理大多是瑜伽行者內證的境界或畢生觀行鑽研的體會心得這是難以家喻戶曉俾眾週知的那末深自秘惜慎簡根器擇人而授免無疑謗也是理所當然印度後期失傳的法門很多這種現象大小乘都有不僅密宗如此我們祇能就當時佛教教義發展的趨勢和一般情況來推測某一法門中的思想基礎和淵源而大略評價他在佛教中的地位和作用疑偽與否是沒有什麼一定的標準來辨別的總結上面所說我們可以大致推定下面一些見解大乘發展到彌勒無著手中以金剛經為般若學的重點提出瑜伽行來綜括菩薩的境行果護法菩薩大成唯識又提出無上菩提可以不待多時少用功力即可成就的見解見成唯識寶生論卷一護法菩薩的門下戒賢親光等特就法界義加以發揮使佛境的意義具體明確起來這時般若理趣經開始受到重視親承戒賢傳法的唐玄奘法師就曾加以翻譯及門弟子窺基所作述贊對於大樂和即身證果的義理都曾加以肯定見窺基理趣述贊卷四及卷六由這一部經的義理所形成的密法是公元六五年以後一百餘年間中國的不空和西藏的蓮華生兩系密宗的中心他們的理論修法和證境以法界為觀境要即身證入法界都可以通過這一部經的一類文獻中找到基本上相同之點不空的內證自覺聖智法和蓮華生的大圓滿內證智法雖然蓮華生這一系的大圓滿教法在西藏流傳的末期難免有駁染增飾的地方但是從佛教發展的過程來看它到是早期密乘中一種淵源深厚的純正的古學的一支參考書目無垢光宗派藏論勝乘藏論法界藏論無畏洲大圓滿前導土官舊派史松巴如意賢樹佛教史西藏大藏經目錄精刻大藏經目錄不空十八會指來玄十七金義述五秘密經勝初軌窺基理趣般若述贊漢書西域傳洛陽伽藍記大唐西域記隋唐書西域傳
